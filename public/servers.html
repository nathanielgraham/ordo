<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50 dark:bg-gray-900" x-data="serversApp()">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordo • Servers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="h-full flex flex-col">
  <div class="bg-indigo-700 text-white p-4 shadow-lg">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Ordo • Servers</h1>
      <div class="text-sm">
        <span class="font-medium">Worker Nodes</span>
        <span class="ml-6">Local time: <span x-text="now"></span></span>
      </div>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto" x-init="init()">
    <div class="max-w-7xl mx-auto p-6">
      <!-- Search & Status -->
      <div class="mb-6 flex flex-col sm:flex-row gap-4 items-start sm:items-center">
        <input type="text" placeholder="Search servers..." class="flex-1 px-4 py-2 border rounded-lg dark:bg-gray-800"
               @input.debounce.500ms="filter = $event.target.value">
        <div class="text-sm text-gray-600 dark:text-gray-400">
          <span x-show="connected" class="text-green-600">● Connected</span>
          <span x-show="!connected" class="text-red-600">● Reconnecting...</span>
          <span class="ml-4" x-text="servers.length + ' server' + (servers.length !== 1 ? 's' : '')"></span>
        </div>
        <button @click="refresh()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg">
          Refresh
        </button>
      </div>

      <!-- Servers Table -->
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow overflow-hidden">
        <table class="w-full">
          <thead class="bg-gray-50 dark:bg-gray-700">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Status</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">ID</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Name</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Host</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">User</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">OS</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Cores</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">CPU %</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Memory %</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Disk %</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Ping</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Uptime</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Last Updated</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
            <template x-for="server in filteredServers" :key="server.id">
              <tr class="hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                <td class="px-6 py-4">
                  <span class="inline-block w-3 h-3 rounded-full"
                        :class="{
                          'bg-green-500': server.ping && server.ping < 100 && server.update_time && (Date.now()/1000 - server.update_time) < 300,
                          'bg-yellow-500': server.ping && server.ping >= 100 || (server.update_time && (Date.now()/1000 - server.update_time) >= 300 && (Date.now()/1000 - server.update_time) < 1800),
                          'bg-red-500': !server.ping || (server.update_time && (Date.now()/1000 - server.update_time) >= 1800)
                        }"
                        :title="server.ping && server.update_time ? 'Online' : 'Offline/Stale'"></span>
                </td>
                <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-300" x-text="server.id"></td>
                <td class="px-6 py-4 text-sm font-medium text-gray-900 dark:text-gray-100" x-text="server.name || '—'"></td>
                <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-300" x-text="server.host || '—'"></td>
                <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-300" x-text="server.user || '—'"></td>
                <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-300" x-text="server.os || '—'"></td>
                <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-300" x-text="server.cores || '—'"></td>
                <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-300" x-text="server.cpu !== undefined ? server.cpu.toFixed(1) + '%' : '—'"></td>
                <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-300">
                  <span x-show="server.total_memory && server.used_memory"
                        x-text="((server.used_memory / server.total_memory) * 100).toFixed(1) + '%'"></span>
                  <span x-show="!server.total_memory || !server.used_memory">—</span>
                </td>
                <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-300">
                  <span x-show="server.total_disk && server.used_disk"
                        x-text="((server.used_disk / server.total_disk) * 100).toFixed(1) + '%'"></span>
                  <span x-show="!server.total_disk || !server.used_disk">—</span>
                </td>
                <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-300" x-text="server.ping !== undefined ? server.ping.toFixed(0) + 'ms' : '—'"></td>
                <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-300">
                  <span x-show="server.uptime" x-text="formatUptime(server.uptime)"></span>
                  <span x-show="!server.uptime">—</span>
                </td>
                <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-300">
                  <span x-show="server.update_time" x-text="formatAgo(server.update_time)"></span>
                  <span x-show="!server.update_time">never</span>
                </td>
              </tr>
            </template>
            <tr x-show="filteredServers.length === 0">
              <td colspan="13" class="px-6 py-12 text-center text-gray-500 dark:text-gray-400">
                No servers found
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function serversApp() {
      return {
        servers: [],
        filteredServers: [],
        filter: '',
        connected: false,
        now: new Date().toLocaleString(),
        ws: null,

        init() {
          setInterval(() => this.now = new Date().toLocaleString(), 1000);
          this.connectWebSocket();
          this.refresh();
        },

        connectWebSocket() {
          const token = this.getToken();
          if (!token) return location.href = '/login';

          const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
          this.ws = new WebSocket(`${proto}//${location.host}/websocket`);

          this.ws.onopen = () => {
            this.connected = true;
            this.ws.send(JSON.stringify({ command: "login_user", token }));
            this.refresh();
          };

          this.ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.command_reply === 'find_monitor' && data.success) {
              this.processServers(data.servers || []);
            }
          };

          this.ws.onclose = () => {
            this.connected = false;
            setTimeout(() => this.connectWebSocket(), 3000);
          };
        },

        refresh() {
          if (this.ws?.readyState === WebSocket.OPEN) {
            this.ws.send(JSON.stringify({ command: "find_monitor" }));
          }
        },

        processServers(servers) {
          this.servers = servers.map(s => ({
            ...s,
            // Pre-calculate any derived fields if needed
          }));
          this.applyFilter();
        },

        applyFilter() {
          const filterLower = this.filter.toLowerCase();
          this.filteredServers = this.servers.filter(server =>
            !this.filter ||
            (server.name && server.name.toLowerCase().includes(filterLower)) ||
            (server.host && server.host.toLowerCase().includes(filterLower)) ||
            (server.user && server.user.toLowerCase().includes(filterLower))
          );
        },

        formatUptime(seconds) {
          if (!seconds) return '—';
          const d = Math.floor(seconds / 86400);
          const h = Math.floor((seconds % 86400) / 3600);
          return d > 0 ? `${d}d ${h}h` : `${h}h`;
        },

        formatAgo(epoch) {
          if (!epoch) return 'never';
          const diff = Math.floor(Date.now() / 1000) - epoch;
          if (diff < 60) return `${diff}s ago`;
          if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
          if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
          return `${Math.floor(diff/86400)}d ago`;
        },

        getToken() {
          const match = document.cookie.match(/ordo_token=([^;]+)/);
          if (match) return decodeURIComponent(match[1]);
          return new URLSearchParams(window.location.search).get('token');
        }
      }
    }
  </script>
</body>
</html>
