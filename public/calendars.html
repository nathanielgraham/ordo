<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50 dark:bg-gray-900" x-data="calendarsApp()">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordo • Calendars</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="h-full flex flex-col">
  <div class="bg-indigo-700 text-white p-4 shadow-lg">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Ordo • Calendars</h1>
      <div class="text-sm">
        <span class="font-medium">Schedules & Triggers</span>
        <span class="ml-6">Local time: <span x-text="now"></span></span>
      </div>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto" x-init="init()">
    <div class="max-w-7xl mx-auto p-6">
      <!-- Search & Status -->
      <div class="mb-6 flex flex-col sm:flex-row gap-4 items-start sm:items-center">
        <input type="text" placeholder="Search calendars or crons..." class="flex-1 px-4 py-2 border rounded-lg dark:bg-gray-800"
               @input.debounce.500ms="filter = $event.target.value">
        <div class="text-sm text-gray-600 dark:text-gray-400">
          <span x-show="connected" class="text-green-600">● Connected</span>
          <span x-show="!connected" class="text-red-600">● Reconnecting...</span>
          <span class="ml-4" x-text="visibleCals.length + ' calendars'"></span>
        </div>
        <button @click="refresh()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg">
          Refresh
        </button>
      </div>

      <!-- Calendars List -->
      <div class="space-y-6">
        <template x-for="cal in visibleCals" :key="cal.id">
          <div class="bg-white dark:bg-gray-800 rounded-lg shadow overflow-hidden">
            <!-- Calendar Header -->
            <div class="p-6 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 transition"
                 @click="cal.open = !cal.open">
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                  <button @click.stop="cal.open = !cal.open">
                    <svg x-show="!cal.open" class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                    <svg x-show="cal.open" class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                  </button>
                  <div>
                    <h2 class="text-xl font-semibold text-gray-900 dark:text-white" x-text="cal.name"></h2>
                    <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">
                      <span x-text="cal.tz"></span>
                      <span class="mx-2">•</span>
                      <span x-text="cal.cluster_ids.length + ' attached cluster' + (cal.cluster_ids.length !== 1 ? 's' : '')"></span>
                      <span x-show="cal.description" class="mx-2">•</span>
                      <span x-show="cal.description" x-text="cal.description" class="italic"></span>
                    </p>
                  </div>
                </div>
                <div class="text-right">
                  <p class="text-sm text-gray-500 dark:text-gray-400">Next run</p>
                  <p class="text-lg font-medium" x-text="cal.next_start_formatted || '—'"></p>
                </div>
              </div>
            </div>

            <!-- Cron Expressions (collapsible) -->
            <div x-show="cal.open" x-collapse>
              <div class="border-t border-gray-200 dark:border-gray-700">
                <template x-if="cal.crons && cal.crons.length">
                  <table class="w-full">
                    <thead class="bg-gray-50 dark:bg-gray-700">
                      <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Cron Expression</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Next Run</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Description</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
                      <template x-for="cron in cal.crons" :key="cron.id">
                        <tr class="hover:bg-gray-50 dark:hover:bg-gray-700">
                          <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-300" x-text="cron.id"></td>
                          <td class="px-6 py-4 text-sm font-mono text-gray-700 dark:text-gray-300" x-text="cron.name"></td>
                          <td class="px-6 py-4 text-sm" x-text="cron.next_start_formatted || '—'"></td>
                          <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-400" x-text="cron.english || '—'"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </template>
                <template x-if="!cal.crons || cal.crons.length === 0">
                  <div class="p-8 text-center text-gray-500 dark:text-gray-400">
                    No cron expressions defined
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>

        <div x-show="visibleCals.length === 0" class="text-center py-12 text-gray-500 dark:text-gray-400">
          No calendars found
        </div>
      </div>
    </div>
  </div>

  <script>
    function calendarsApp() {
      return {
        calendars: [],
        visibleCals: [],
        filter: '',
        connected: false,
        now: new Date().toLocaleString(),
        ws: null,

        init() {
          setInterval(() => this.now = new Date().toLocaleString(), 1000);
          this.connectWebSocket();
          this.refresh();
        },

        connectWebSocket() {
          const token = this.getToken();
          if (!token) return location.href = '/login';

          const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
          this.ws = new WebSocket(`${proto}//${location.host}/websocket`);

          this.ws.onopen = () => {
            this.connected = true;
            this.ws.send(JSON.stringify({ command: "login_user", token }));
            this.refresh();
          };

          this.ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.command_reply === 'find_cal' && data.success) {
              this.processCalendars(data.cals || []);
            }
          };

          this.ws.onclose = () => {
            this.connected = false;
            setTimeout(() => this.connectWebSocket(), 3000);
          };
        },

        refresh() {
          if (this.ws?.readyState === WebSocket.OPEN) {
            this.ws.send(JSON.stringify({ command: "find_cal" }));
          }
        },

        processCalendars(cals) {
          this.calendars = cals.map(cal => ({
            ...cal,
            open: true,
            next_start_formatted: cal.next_start ? new Date(cal.next_start * 1000).toLocaleString() : '',
            crons: (cal.crons || []).map(cron => ({
              ...cron,
              next_start_formatted: cron.next_start ? new Date(cron.next_start * 1000).toLocaleString() : ''
            }))
          }));
          this.applyFilter();
        },

        applyFilter() {
          const filterLower = this.filter.toLowerCase();
          this.visibleCals = this.calendars.filter(cal => {
            const matchesName = cal.name.toLowerCase().includes(filterLower);
            const matchesDesc = cal.description && cal.description.toLowerCase().includes(filterLower);
            const matchesCron = cal.crons?.some(cron =>
              cron.name.toLowerCase().includes(filterLower) ||
              (cron.english && cron.english.toLowerCase().includes(filterLower))
            );
            return matchesName || matchesDesc || matchesCron;
          });
        },

        getToken() {
          const match = document.cookie.match(/ordo_token=([^;]+)/);
          if (match) return decodeURIComponent(match[1]);
          return new URLSearchParams(window.location.search).get('token');
        }
      }
    }
  </script>
</body>
</html>
